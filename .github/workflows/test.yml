name: Test

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.11"
            tox: py311
          - python: "3.12"
            tox: py312
          - python: "3.13"
            tox: py313
          - python: "3.14"
            tox: py314

    env:
      PKG_INCLUDE_LINKINGTO: "TRUE"
      RPY2_CFFI_MODE: ABI

    steps:
      - uses: actions/checkout@v6
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Configure R shared library
        shell: bash
        run: |
          r_home="$(R RHOME)"
          python_lib="$(python -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))')"
          echo "R_HOME=${r_home}" >> "${GITHUB_ENV}"
          echo "LD_LIBRARY_PATH=${python_lib}:${r_home}/lib${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}" >> "${GITHUB_ENV}"
      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::arules
            any::arulesViz
      - name: Install tox
        run: python -m pip install "tox>=4"
      - name: Run tests
        run: python -m tox run -e ${{ matrix.tox }}

  package:
    name: Validate distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install build tools
        run: python -m pip install build twine
      - name: Build distributions
        run: python -m build
      - name: Check distribution metadata
        run: python -m twine check dist/*

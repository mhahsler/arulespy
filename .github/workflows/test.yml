name: Test

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
            tox: py311
          # 3.12 fails on GitHub Actions due to missing libpython3.12.so.1.0 in the system library path, which is required for rpy2 to work properly.
          # - python: "3.12"
          #  tox: py312
          - os: ubuntu-latest
            python: "3.13"
            tox: py313
          - os: ubuntu-latest
            python: "3.14"
            tox: py314
          - os: windows-latest
            python: "3.13"
            tox: py313

    env:
      PKG_INCLUDE_LINKINGTO: "TRUE"
      RPY2_CFFI_MODE: ABI

    steps:
      - uses: actions/checkout@v6
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Configure R shared library
        if: runner.os == 'Linux'
        shell: bash
        run: |
          r_home="$(R RHOME)"
          echo "R_HOME=${r_home}" >> "${GITHUB_ENV}"
          sudo ln -sf "${r_home}/lib/libR.so" /usr/local/lib/libR.so
          sudo ldconfig
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::arules
            any::arulesViz
      - name: Install tox
        run: python -m pip install "tox>=4"
      - name: Run tests
        run: python -m tox run -e ${{ matrix.tox }}

  package:
    name: Validate distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install build tools
        run: python -m pip install build twine
      - name: Build distributions
        run: python -m build
      - name: Check distribution metadata
        run: python -m twine check dist/*
